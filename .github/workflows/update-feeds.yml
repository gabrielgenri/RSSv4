name: Actualizar Canales RSS (3x al dia) · RSSv3

on:
  schedule:
    # 08:00, 13:00 y 19:00 hora de Argentina (UTC-3) -> 11:00, 16:00 y 22:00 UTC
    - cron: "0 11,16,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rastrear, extraer cuerpo/imagen, vincular taxonomias y consolidar (RSSv3)
        run: python scripts/fetch_and_classify.py

      - name: Commit y push de datos actualizados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/noticias_consolidadas.json data/feeds_argentina_larioja.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(RSSv3): actualizar noticias, cuerpos y contenidos vinculados $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Sin cambios nuevos para publicar."
          fi
